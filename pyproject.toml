[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wagent"
version = "0.1.0.dev0"
description = "Reliable WhatsApp delivery for LangGraph agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pywa[server]>=4.5.0",
  "langgraph>=1.2.21",
  "langchain>=1.5.0",
  "fastapi>=0.162.5",
  "sqlalchemy[asyncio]>=2.1.8",
  "alembic>=1.15",
  "aiosqlite>=0.21",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic-settings>=2.8",
  "python-dotenv>=1.0",
  "httpx>=0.28",
  "filelock>=3.18",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "psycopg[binary,pool]>=3.2", "langgraph-checkpoint-postgres>=2.0"]
dev = ["ruff==0.17.5", "pyright>=1.1.400", "pytest>=8.3", "pytest-asyncio>=0.26", "pre-commit>=4.2", "build>=1.2"]
docs = ["mkdocs-material>=9.6"]

[project.scripts]
wagent = "wagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wagent"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ve", "docs/BRIEF.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["ve", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers"
